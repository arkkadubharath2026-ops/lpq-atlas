#   python -m lpq_tools.data.derive --from-manifest configs/derived_datasets.yaml
# Seeds are explicit. graph_checksum_fnv1a64 pins the output; the integer-only
# transforms (unit, uniform, scale, clip, bimodal) are exact on any platform,
# lognormal and pareto use libm and are pinned to the generating host's libm.
# Processed graphs (datasets/processed/) are git-ignored; this file, the
# metadata and the query manifests are what is committed.
# Derived graphs are never real road networks.
