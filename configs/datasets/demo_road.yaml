# LPQ Atlas demonstration graph: SYNTHETIC, road-like, ~19.6k nodes.
#
# This is NOT real road data. It is generated, deterministically and offline, by
# scripts/demo/make_demo_graph.py (fixed seed) so that a fresh clone can build,
# test, run and benchmark the whole system with no network access. The two source
# files are small enough (~0.5 MB gzipped) to be committed under datasets/demo/,
# and the digests below pin them, so a changed generator or a corrupted checkout
# is detected rather than silently measured. `make_demo_graph.py --check`
# verifies the committed files against the generator.
#
# About the "url" fields below: they name where these committed files live on the
# repository's main branch (they become valid once this branch is merged and
# pushed; this has not been checked). The scripts never need them: the files are
# already in the clone under datasets/demo/, and scripts/demo/prepare_demo.py
# copies them into datasets/raw/ (where the pipeline expects raw files) before
# running the normal pipeline. So `prepare_datasets.py demo_road` on a clone that
# has not run prepare_demo.py would try the download; run
# scripts/demo/prepare_demo.py (scripts/setup/setup does) instead.
#
# Weights are travel time in deciseconds; coordinates are micro-degrees placed in
# open ocean near the equator, so no basemap pretends to match the graph. The
# graph is strongly connected (every query pair is reachable) and, with weights
# at least length * 36 / 110 deciseconds per metre, the engine's derived A*
# heuristic scale is informative.
dataset_id: demo_road
description: >
  Synthetic road-like demonstration network (19,600 nodes, two-way streets,
  integer travel-time weights, coordinates). Generated, not measured; use the
  DIMACS or OSM datasets for anything that is reported as a result.

source_format: dimacs
files:
  - url: https://raw.githubusercontent.com/arkkadubharath2026-ops/lpq-atlas/main/datasets/demo/demo_road.gr.gz
    sha256: ab78ce611315237c7dccfe1be19462846b92e11bf34d7d4fb1ebffa7a32718f3
    role: graph
  - url: https://raw.githubusercontent.com/arkkadubharath2026-ops/lpq-atlas/main/datasets/demo/demo_road.co.gz
    sha256: 4eb5b9b80c547d8909063aaccb81ee15ee92fd4612e1bfd1d04991e32327fac0
    role: coordinates

# Both directions of every street are listed as separate arc records.
directedness: directed
self_loops: drop
parallel_edges: keep

query_seed: 42
query_count: 200

provenance:
  collection: LPQ Atlas synthetic demonstration graph
  generator: scripts/demo/make_demo_graph.py
  generator_seed: 20260930
  synthetic: true
  licence: Generated by this repository; same licence as the repository.
